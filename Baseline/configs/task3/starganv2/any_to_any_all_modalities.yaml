task: 3
task_name: task3_any_to_any_multimodal
method: starganv2
model:
  img_size: 512
  style_dim: 64
  latent_dim: 16
  num_domains: 15
  max_conv_dim: 512
  input_nc: 1
domains:
- 0.1T
- 1.5T
- 3T
- 5T
- 7T
data:
  source_fields:
  - 0.1T
  - 1.5T
  - 3T
  - 5T
  - 7T
  modalities:
  - T1W
  - T2W
  - T2FLAIR
  crop_size:
  - 512
  - 512
  slice_axis: 2
  normalize: true
  use_monai: true
  slice_range: [120, 210]
  cache_dir: /path/to/baseline_cache
  augment:
    rotate: 0.1
    scale: [0.9, 1.1]
    translate: 5
    flip_lr: true
inference:
  batch_size: 16
pretrain:
  split: retro_train
  batch_size: 2
  num_workers: 8
  lr: 0.0001
  f_lr: 1.0e-06
  beta1: 0.0
  beta2: 0.99
  weight_decay: 0.0001
  lambda_reg: 1.0
  lambda_sty: 1.0
  lambda_ds: 1.0
  lambda_cyc: 1.0
  ds_iter: 100000
  ema_beta: 0.999
  n_epochs: 50
  n_epochs_decay: 50
  max_iters_per_epoch: 1000
  save_every: 10
  val_every: 1
  display_freq: 100
  print_every: 1000
  mixed_precision: bf16
  max_grad_norm: 1.0
  early_stop_patience: 10
  early_stop_min_epochs: 60
finetune:
  split: pro_train
  batch_size: 2
  num_workers: 8
  lr: 5.0e-05
  beta1: 0.5
  beta2: 0.999
  epochs: 50
  save_every: 10
  val_every: 1
  display_freq: 100
  warmup_epochs: 5
  mixed_precision: "no"
  max_grad_norm: 1.0
  ema_beta: 0.999
  early_stop_patience: 10
  early_stop_min_epochs: 20
  loss_l1: 1.0
  loss_lpips: 0.5
  loss_ssim: 0.1
  loss_edge: 0.0
evaluation:
  split: pro_train
  target_field: 7T
  source_fields:
  - 0.1T
  - 1.5T
  - 3T
  - 5T
  slice_range: [150, 180]
  metrics:
  - nrmse
  - ssim
  - lpips
  - psnr
