[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mrixfields-fieldrf"
version = "0.1.0"
description = "FieldRF — Anatomy-Conditioned 3D Rectified Flow for Cross-Field MRI Harmonization"

[tool.setuptools.packages.find]
include = ["models", "data", "scripts", "utils", "configs"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.py"]
