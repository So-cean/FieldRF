[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mrixfields-fieldrf"
version = "0.1.0"
description = "FieldRF — Anatomy-Conditioned 3D Rectified Flow for Cross-Field MRI Harmonization"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "monai",
    "einops",
    "numpy",
    "nibabel",
    "blosc2",
    "PyYAML",
    "matplotlib",
    "scikit-image",
]

[project.optional-dependencies]
test = ["pytest"]
brainid = ["torchvision", "pytorch-msssim", "SimpleITK", "iopath", "simplejson", "tabulate", "pytz", "visdom"]

[tool.setuptools.packages.find]
include = ["models", "data", "scripts", "utils", "configs"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.py"]
