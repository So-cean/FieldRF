[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mrixfields-fieldrf"
version = "0.1.0"
description = "FieldRF — Anatomy-Conditioned 3D Rectified Flow for Cross-Field MRI Harmonization"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mri", "mri-harmonization", "rectified-flow"]
dependencies = [
    "torch",
    "torchvision",
    "lpips",
    "monai",
    "einops",
    "numpy",
    "nibabel",
    "blosc2",
    "PyYAML",
    "matplotlib",
    "scikit-image",
]

[project.urls]
Repository = "https://github.com/So-cean/FieldRF"
Documentation = "https://github.com/So-cean/FieldRF/blob/main/README.md"
Paper = "https://papers.miccai.org/miccai-2026-sat/MRIxFields2026_026.html"
Issues = "https://github.com/So-cean/FieldRF/issues"

[project.scripts]
fieldrf-pretrain = "fieldrf.cli.train:main"
fieldrf-align = "fieldrf.cli.train_endpoint_aligner:main"
fieldrf-finetune = "fieldrf.cli.finetune:main"
fieldrf-vae-finetune = "fieldrf.cli.finetune_vae:main"
fieldrf-infer = "fieldrf.cli.inference:main"
fieldrf-cache-latents = "fieldrf.cli.cache_latents:main"
fieldrf-cache-brainid = "fieldrf.cli.cache_brainid_feat:main"
fieldrf-check = "fieldrf.cli.check_pipeline:main"
fieldrf-migrate-checkpoint = "fieldrf.cli.migrate_checkpoint:main"

[project.optional-dependencies]
test = ["pytest"]
brainid = ["torchvision", "pytorch-msssim", "SimpleITK", "iopath", "simplejson", "tabulate", "pytz", "visdom"]

[tool.setuptools.packages.find]
include = ["fieldrf*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.py"]
